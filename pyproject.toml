[project]
name = "web-intelligence-agent"
version = "0.1.0"
description = "AI Website Audit + Outreach Automation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "motor>=3.6.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "qdrant-client>=1.12.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
osm = [
    "osmium>=4.0.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
osm-ingest = "osm_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "osm_ingest"]

[tool.hatch.build.targets.wheel.force-include]
"osm_ingest/config/business_tags.yaml" = "osm_ingest/config/business_tags.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "osm_ingest/tests"]
pythonpath = [".", "osm_ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
